name: 'T.O.M.M.I. AI Code Reviewer'
description: "Tommy's Online Minecraft Modding Intelligence - Autonomous Code Reviewer & Feedback Learner"
author: 'Thomas Glasser'

branding:
  icon: 'code'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub Token with permissions for pull-requests:write, issues:write, and contents:write'
    required: false
    default: ''
  app-id:
    description: 'GitHub App ID for multi-repo installation access'
    required: false
    default: ''
  private-key:
    description: 'GitHub App Private Key (.pem format) for multi-repo installation access'
    required: false
    default: ''
  gemini-api-key:
    description: 'Google Gemini API Key (fallback if specific keys are not provided)'
    required: false
    default: ''
  review-api-key:
    description: 'Dedicated Google Gemini API Key for code reviews and discussions (TOMMI_REVIEW_API_KEY)'
    required: false
    default: ''
  feedback-api-key:
    description: 'Dedicated Google Gemini API Key for /tommi learn and false-positive commands (TOMMI_FEEDBACK_API_KEY)'
    required: false
    default: ''
  merge-api-key:
    description: 'Dedicated Google Gemini API Key for post-merge rule learning (TOMMI_MERGE_API_KEY)'
    required: false
    default: ''
  model:
    description: 'Gemini model to use for analysis (default: auto - automatically discovers the newest Flash model)'
    required: false
    default: 'auto'
  tommi-repo:
    description: 'Repository name where central TOMMI rules are hosted'
    required: false
    default: 'thomasglasser/TOMMI'
  thinking-budget:
    description: 'Thinking budget in tokens for Gemini reasoning (default: 2048; set to 0 to disable)'
    required: false
    default: '2048'
  enable-tools:
    description: 'Enable repository code tracing tools (default: false - reviews diffs directly for speed and quota efficiency)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Pip Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-tommi-${{ hashFiles(format('{0}/requirements.txt', github.action_path)) }}
        restore-keys: |
          pip-tommi-

    - name: Install Dependencies
      shell: bash
      run: |
        pip install -r ${{ github.action_path }}/requirements.txt

    - name: Run TOMMI Engine
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        APP_ID: ${{ inputs.app-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        TOMMI_REVIEW_API_KEY: ${{ inputs.review-api-key }}
        TOMMI_FEEDBACK_API_KEY: ${{ inputs.feedback-api-key }}
        TOMMI_MERGE_API_KEY: ${{ inputs.merge-api-key }}
        MODEL_NAME: ${{ inputs.model }}
        TOMMI_REPO: ${{ inputs.tommi-repo }}
        THINKING_BUDGET: ${{ inputs.thinking-budget }}
        ENABLE_TOOLS: ${{ inputs.enable-tools }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        COMMENT_ID: ${{ github.event.comment.id }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        COMMENT_AUTHOR: ${{ github.event.comment.user.login || github.event.review.user.login || github.actor || '' }}
        COMMENT_AUTHOR_TYPE: ${{ github.event.comment.user.type || github.event.review.user.type || '' }}
        IN_REPLY_TO_ID: ${{ github.event.comment.in_reply_to_id || '' }}
        DIFF_HUNK: ${{ github.event.comment.diff_hunk || '' }}
        FILE_PATH: ${{ github.event.comment.path || '' }}
        EVENT_NAME: ${{ github.event_name }}
        IS_MERGED: ${{ github.event.pull_request.merged || false }}
        PYTHONPATH: ${{ github.action_path }}
      run: |
        python ${{ github.action_path }}/src/main.py
